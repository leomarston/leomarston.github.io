<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            background-color: #f3f4f6;
            padding: 1rem;
            border-radius: 0.5rem;
            max-height: 60vh;
            overflow-y: auto;
            line-height: 1.6;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 sm:p-8 rounded-lg shadow-md w-full max-w-xl">
        <h1 class="text-2xl sm:text-3xl font-bold mb-6 text-center text-gray-800">Lyrics Finder</h1>

        <form id="lyrics-form" class="space-y-4">
            <div>
                <label for="artist" class="block text-sm font-medium text-gray-700 mb-1">Artist:</label>
                <input type="text" id="artist" name="artist" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 shadow-sm">
            </div>
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Song Title:</label>
                <input type="text" id="title" name="title" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 shadow-sm">
            </div>
            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                Get Lyrics
            </button>
        </form>

        <div id="loader" class="loader"></div>

        <div id="lyrics-result" class="mt-6 text-gray-700">
            </div>
    </div>

    <script>
        const lyricsForm = document.getElementById('lyrics-form');
        const artistInput = document.getElementById('artist');
        const titleInput = document.getElementById('title');
        const lyricsResultDiv = document.getElementById('lyrics-result');
        const loader = document.getElementById('loader');

        lyricsForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const artist = artistInput.value.trim();
            const title = titleInput.value.trim();

            if (!artist || !title) {
                lyricsResultDiv.innerHTML = '<p class="text-red-600 text-center">Please enter both artist and song title.</p>';
                return;
            }

            lyricsResultDiv.innerHTML = '';
            loader.style.display = 'block';

            const apiUrl = `https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`;

            try {
                const response = await fetch(apiUrl);

                if (response.ok) {
                    const data = await response.json();
                    lyricsResultDiv.innerHTML = `
                        <h2 class="text-xl font-semibold mb-2 text-gray-800">${artist} - ${title}</h2>
                        <pre>${data.lyrics || 'Lyrics not found.'}</pre>
                    `;
                } else if (response.status === 404) {
                    lyricsResultDiv.innerHTML = '<p class="text-orange-600 text-center">Lyrics not found for this song. Please check the artist and title.</p>';
                } else {
                    lyricsResultDiv.innerHTML = `<p class="text-red-600 text-center">An error occurred (Status: ${response.status}). Please try again later.</p>`;
                }
            } catch (error) {
                console.error("Fetch error:", error);
                lyricsResultDiv.innerHTML = '<p class="text-red-600 text-center">Could not connect to the lyrics service. Please check your internet connection.</p>';
            } finally {
                loader.style.display = 'none';
            }
        });
    </script>

</body>
</html>
